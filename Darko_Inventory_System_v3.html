<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="darko-ims.webmanifest" />
    <link
      id="appTouchIcon"
      rel="apple-touch-icon"
      href="apple-touch-icon-180.png"
    />
    <link
      id="appFavicon"
      rel="icon"
      type="image/png"
      href="darko-ims-icon-192.png"
    />
    <title>
      Darko Pharmaceuticals & Medical Supplies - Sales & Inventory Management
      System
    </title>
    <style>
      :root {
        --teal: #0f766e;
        --teal-dark: #115e59;
        --teal-light: #ccfbf1;
        --bg: #f1f5f9;
        --card: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --green: #16a34a;
        --amber: #d97706;
        --red: #dc2626;
        --blue: #2563eb;
        --border: #e2e8f0;
        --shadow:
          0 1px 3px rgba(15, 23, 42, 0.08), 0 4px 14px rgba(15, 23, 42, 0.06);
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
      }
      .shell {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 238px;
        flex-shrink: 0;
        background: linear-gradient(180deg, var(--teal), var(--teal-dark));
        color: #fff;
        display: flex;
        flex-direction: column;
        padding: 20px 14px 16px;
        position: sticky;
        top: 0;
        height: 100vh;
        box-sizing: border-box;
        box-shadow: var(--shadow);
        overflow-y: auto;
        transition:
          width 0.22s ease,
          padding 0.22s ease,
          opacity 0.18s ease;
      }
      #appShell.nav-closed .sidebar {
        width: 0;
        min-width: 0;
        flex-basis: 0;
        padding-left: 0;
        padding-right: 0;
        opacity: 0;
        overflow: hidden;
      }
      .app-toolbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(241, 245, 249, 0.94);
        padding: 8px 0 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.02rem;
        font-weight: 700;
        letter-spacing: 0.3px;
        padding: 0 6px;
      }
      .brand .logo {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: #fff;
        color: var(--teal);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        flex-shrink: 0;
      }
      .brand small {
        display: block;
        font-size: 0.64rem;
        font-weight: 400;
        opacity: 0.85;
      }
      .sidebar nav.tabs {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 22px 0 12px;
      }
      .sidebar nav.tabs button {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: #fff;
        text-align: left;
        padding: 11px 14px;
        border-radius: 9px;
        cursor: pointer;
        font-size: 0.92rem;
        font-weight: 600;
        transition: 0.15s;
        width: 100%;
      }
      .sidebar nav.tabs button:hover {
        background: rgba(255, 255, 255, 0.22);
      }
      .sidebar nav.tabs button.active {
        background: #fff;
        color: var(--teal-dark);
      }
      .sidefoot {
        margin-top: auto;
      }
      .userbadge {
        background: rgba(255, 255, 255, 0.13);
        border-radius: 9px;
        padding: 9px 12px;
        font-size: 0.85rem;
        margin-bottom: 10px;
        line-height: 1.35;
      }
      #clock {
        font-size: 0.72rem;
        opacity: 0.85;
        padding: 0 6px 10px;
      }
      .content {
        flex: 1;
        min-width: 0;
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 22px 18px 60px;
      }
      #loginWrap {
        position: fixed;
        inset: 0;
        background:
          linear-gradient(rgba(8, 37, 39, 0.42), rgba(8, 37, 39, 0.58)),
          center / cover no-repeat fixed;
        z-index: 500;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .login-card {
        background: #fff;
        border-radius: 16px;
        padding: 34px 30px;
        width: 370px;
        max-width: 94vw;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      }
      .login-logo-mark {
        width: 76px;
        height: 76px;
        margin: 0 auto 12px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--teal);
        color: #fff;
        font-size: 2.3rem;
        font-weight: 800;
        box-shadow: 0 5px 16px rgba(15, 118, 110, 0.24);
      }
      .login-logo-mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #fff;
      }
      .print-only {
        display: none;
      }
      @media (max-width: 860px) {
        .shell {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
          height: auto;
          position: static;
        }
        #appShell.nav-closed .sidebar {
          display: none;
        }
        .sidebar nav.tabs {
          flex-direction: row;
          flex-wrap: wrap;
        }
        .sidebar nav.tabs button {
          width: auto;
        }
      }
      @media print {
        @page {
          size: A4;
          margin: 12mm;
        }
        @page receipt {
          size: 80mm auto;
          margin: 2mm;
        }
        .sidebar,
        #toast,
        #loginWrap,
        .no-print {
          display: none !important;
        }
        #appShell .content > main {
          display: none !important;
        }
        #modalWrap {
          position: static;
          display: block !important;
          background: #fff;
          padding: 0;
        }
        #modalBox {
          box-shadow: none;
          border-radius: 0;
          max-width: 100%;
          max-height: none;
          padding: 0;
          overflow: visible !important;
        }
        #modalBox div[style*="max-height"] {
          max-height: none !important;
          overflow: visible !important;
        }
        .print-only {
          display: block;
          text-align: center;
          margin-bottom: 8px;
        }
        .print-brand {
          display: flex !important;
          align-items: center;
          justify-content: center;
          gap: 12px;
          color: #111 !important;
          text-align: center;
          margin: 0 auto 14px;
          padding: 0 0 10px;
          border-bottom: 1px solid #777;
          font-size: 11pt;
          line-height: 1.3;
          break-inside: avoid;
        }
        .print-brand img {
          display: block;
          width: 64px;
          height: 64px;
          object-fit: contain;
          flex: 0 0 auto;
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
        .print-brand-copy {
          display: flex;
          flex-direction: column;
          gap: 3px;
        }
        .print-brand-name {
          font-size: 15pt;
          font-weight: 750;
        }
        .print-brand-subtitle {
          font-size: 9pt;
          color: #333 !important;
        }
        body.print-a4 #globalPrintHeader {
          display: flex !important;
        }
        body.print-a4 #appShell .content > main {
          color: #111 !important;
        }
        body.print-a4 #appShell .content > main table {
          width: 100%;
          border-collapse: collapse;
        }
        body.print-a4 #appShell .content > main th,
        body.print-a4 #appShell .content > main td {
          color: #111 !important;
          border-color: #777 !important;
          padding: 5px 6px;
          font-size: 9pt;
          overflow-wrap: anywhere;
        }
        body.print-a4 #appShell .content > main .panel {
          box-shadow: none;
          border: 1px solid #bbb;
          break-inside: avoid;
        }
        body.print-a4 #appShell .content > main [style*="overflow"] {
          overflow: visible !important;
          max-height: none !important;
        }
        body.print-receipt .print-brand {
          margin-bottom: 8px;
        }
        body.print-receipt .print-brand img {
          width: 58px;
          height: 58px;
        }
        body.print-a4:not(.print-receipt) #modalWrap {
          display: none !important;
        }
        body.print-a4 #appShell .content > main {
          display: block !important;
          max-width: none;
          margin: 0;
          padding: 0;
        }
        body.print-a4 #appShell .content > main > .view {
          display: none !important;
        }
        body.print-a4 #appShell .content > main > .view.active {
          display: block !important;
        }
        body.print-receipt #modalWrap {
          display: block !important;
        }
        body.print-receipt #appShell .content > main {
          display: none !important;
        }
        body.print-pos #modalBox {
          width: 80mm;
          max-width: 80mm;
          page: receipt;
          padding: 0;
        }
        body.print-pos .receipt {
          width: 76mm;
          max-width: 76mm;
          border: 0;
          border-radius: 0;
          padding: 0;
          font-size: 10pt;
          line-height: 1.35;
          color: #111 !important;
          overflow-wrap: anywhere;
        }
        body.print-pos .receipt .print-brand {
          gap: 5px;
          font-size: 8pt;
          margin-bottom: 6px;
          padding-bottom: 5px;
        }
        body.print-pos .receipt .print-brand img {
          width: 38px;
          height: 38px;
        }
        body.print-pos .receipt .print-brand-name {
          font-size: 10pt;
        }
        body.print-pos .receipt .print-brand-subtitle {
          font-size: 7pt;
        }
        body.print-pos #modalBox > .print-brand {
          width: 76mm;
          max-width: 76mm;
          gap: 4px;
          margin-bottom: 6px;
        }
        body.print-pos #modalBox > .print-brand img {
          width: 30px;
          height: 30px;
        }
        body.print-pos #modalBox > .print-brand .print-brand-name {
          font-size: 8pt;
        }
        body.print-pos #modalBox > .print-brand .print-brand-subtitle {
          font-size: 6pt;
        }
        body.print-pos .receipt table {
          width: 100%;
          border-collapse: collapse;
        }
        body.print-pos .receipt td {
          color: #111 !important;
          padding: 3px 0;
          vertical-align: top;
        }
        body.print-pos #modalBox div[style*="max-height"] {
          max-height: none !important;
          overflow: visible !important;
        }
        body.print-pos #modalBox {
          overflow: visible !important;
        }
        body.print-pos #modalBox > div:last-child {
          display: none !important;
        }
        body.print-a4:not(.print-receipt) tr {
          break-inside: avoid;
        }
        body {
          background: #fff;
        }
      }
      .view {
        display: none;
      }
      .view.active {
        display: block;
      }
      h2 {
        font-size: 1.3rem;
        margin-bottom: 4px;
      }
      .sub {
        color: var(--muted);
        font-size: 0.88rem;
        margin-bottom: 18px;
      }
      .grid-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 14px;
        margin-bottom: 22px;
      }
      .card {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 16px 18px;
        border: 1px solid var(--border);
      }
      .card .k {
        font-size: 0.75rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.6px;
        font-weight: 700;
      }
      .card .v {
        font-size: 1.55rem;
        font-weight: 800;
        margin-top: 6px;
      }
      .card .d {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 3px;
      }
      .card.teal {
        border-top: 4px solid var(--teal);
      }
      .card.green {
        border-top: 4px solid var(--green);
      }
      .card.amber {
        border-top: 4px solid var(--amber);
      }
      .card.red {
        border-top: 4px solid var(--red);
      }
      .card.blue {
        border-top: 4px solid var(--blue);
      }
      .panel {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        padding: 18px;
        margin-bottom: 20px;
      }
      .panel h3 {
        font-size: 1rem;
        margin-bottom: 12px;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 14px;
      }
      input,
      select,
      textarea {
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 9px;
        font-size: 0.9rem;
        background: #fff;
        color: var(--ink);
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--teal-light);
        border-color: var(--teal);
      }
      .btn {
        border: none;
        border-radius: 9px;
        padding: 9px 16px;
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.15s;
        background: var(--teal);
        color: #fff;
      }
      .btn:hover {
        background: var(--teal-dark);
      }
      .btn.ghost {
        background: #fff;
        color: var(--teal-dark);
        border: 1px solid var(--border);
      }
      .btn.danger {
        background: var(--red);
      }
      .btn.warn {
        background: var(--amber);
      }
      .btn.green {
        background: var(--green);
      }
      .btn.sm {
        padding: 5px 10px;
        font-size: 0.78rem;
        border-radius: 7px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.86rem;
      }
      th {
        background: #f8fafc;
        text-align: left;
        padding: 10px 10px;
        color: var(--muted);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 2px solid var(--border);
        white-space: nowrap;
      }
      td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      tr:hover td {
        background: #f8fafc;
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .badge {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 700;
        white-space: nowrap;
      }
      .b-ok {
        background: #dcfce7;
        color: #166534;
      }
      .b-low {
        background: #fef3c7;
        color: #92400e;
      }
      .b-out {
        background: #fee2e2;
        color: #991b1b;
      }
      .b-exp {
        background: #fde8e8;
        color: #991b1b;
      }
      .b-cat {
        background: #e0f2fe;
        color: #075985;
      }
      .pos-wrap {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 18px;
      }
      @media (max-width: 900px) {
        .pos-wrap {
          grid-template-columns: 1fr;
        }
      }
      .prod-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
        gap: 10px;
        max-height: 62vh;
        overflow: auto;
        padding: 4px;
      }
      .pcard {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 11px 13px;
        cursor: pointer;
        transition: 0.12s;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
      }
      .pcard:hover {
        border-color: var(--teal);
        transform: translateY(-1px);
        box-shadow: var(--shadow);
      }
      .pcard.disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .pcard .pn {
        font-weight: 600;
        font-size: 0.85rem;
        line-height: 1.25;
      }
      .pcard .pp {
        color: var(--teal-dark);
        font-weight: 800;
        margin-top: 5px;
      }
      .pcard .ps {
        font-size: 0.72rem;
        color: var(--muted);
        margin-top: 3px;
      }
      .cart-list {
        max-height: 38vh;
        overflow: auto;
      }
      .cart-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px dashed var(--border);
        font-size: 0.85rem;
      }
      .cart-row .nm {
        flex: 1;
        line-height: 1.25;
      }
      .qtybtn {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #fff;
        cursor: pointer;
        font-weight: 800;
        color: var(--teal-dark);
      }
      .totline {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        font-size: 0.9rem;
      }
      .totline.grand {
        font-size: 1.15rem;
        font-weight: 800;
        color: var(--teal-dark);
        border-top: 2px solid var(--border);
        margin-top: 6px;
        padding-top: 10px;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 26px;
        font-size: 0.88rem;
      }
      .bar-chart {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 150px;
        padding: 8px 4px;
      }
      .bar-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      .bar {
        width: 100%;
        max-width: 46px;
        background: linear-gradient(180deg, var(--teal), #14b8a6);
        border-radius: 6px 6px 0 0;
        min-height: 3px;
      }
      .bar-col .bl {
        font-size: 0.68rem;
        color: var(--muted);
      }
      .bar-col .bv {
        font-size: 0.68rem;
        font-weight: 700;
      }
      #toast {
        position: fixed;
        bottom: 22px;
        right: 22px;
        z-index: 200;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .toast {
        background: var(--ink);
        color: #fff;
        padding: 11px 18px;
        border-radius: 10px;
        font-size: 0.86rem;
        box-shadow: var(--shadow);
        animation: fadein 0.25s;
      }
      .toast.err {
        background: var(--red);
      }
      .toast.ok {
        background: var(--green);
      }
      @keyframes fadein {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      #modalWrap {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.5);
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      #modalWrap.open {
        display: flex;
      }
      #modalBox {
        background: #fff;
        border-radius: 14px;
        max-width: 560px;
        width: 100%;
        max-height: 88vh;
        overflow: auto;
        padding: 22px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .form-grid .full {
        grid-column: 1/-1;
      }
      label {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--muted);
        display: block;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .settings-note {
        background: #f0fdfa;
        border: 1px solid #99f6e4;
        border-radius: 10px;
        padding: 14px;
        font-size: 0.83rem;
        line-height: 1.55;
        color: #134e4a;
        margin-top: 10px;
      }
      .settings-note code {
        background: #ccfbf1;
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 0.78rem;
      }
      .receipt {
        page: receipt;
        font-family: "Courier New", monospace;
        font-size: 0.85rem;
        border: 1px dashed var(--border);
        padding: 16px;
        border-radius: 8px;
      }
      .receipt h4 {
        text-align: center;
        margin-bottom: 4px;
        font-family: inherit;
      }
      .receipt table {
        font-size: 0.8rem;
      }
      .print-brand.print-only {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="loginWrap">
      <div class="login-card">
        <div id="loginLogo" class="login-logo-mark" aria-label="Company logo">
          D
        </div>
        <h3 id="loginBrandName" style="text-align: center; margin: 6px 0 2px">
          Darko Pharma IMS
        </h3>
        <p
          style="
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 18px;
          "
        >
          Sales &amp; Inventory Management | Sign in
        </p>
        <label>Username</label
        ><input
          id="loginUser"
          style="width: 100%; margin-bottom: 10px"
          autocomplete="username"
          onkeydown="if (event.key === 'Enter') attemptLogin();"
        />
        <label>Password</label
        ><input
          id="loginPass"
          type="password"
          style="width: 100%; margin-bottom: 6px"
          autocomplete="current-password"
          onkeydown="if (event.key === 'Enter') attemptLogin();"
        />
        <p
          id="loginErr"
          style="
            color: var(--red);
            font-size: 0.8rem;
            min-height: 1.2em;
            margin: 2px 0 8px;
          "
        ></p>
        <button class="btn" style="width: 100%" onclick="attemptLogin()">
          Sign In

   Current password hashes use PBKDF2; legacy hashes upgrade at next login.
   Client-side roles do not secure records from users with browser/device access. */
      function pwHash(s) {
        let h = 0x811c9dc5;
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 0x01000193) >>> 0;
        }
        return (
          ("00000000" + h.toString(16)).slice(-8) +
          ("00000000" + (Math.imul(h, 0x85ebca6b) >>> 0).toString(16)).slice(-8)
        );
      }
      const PASSWORD_ITERATIONS = 210000,
        SESSION_TIMEOUT_MS = 30 * 60 * 1000,
        AUTH_THROTTLE_KEY = "darko_login_throttle_v1";
      function bytesToBase64(bytes) {
        return btoa(String.fromCharCode(...new Uint8Array(bytes)));
      }
      function base64ToBytes(value) {
        return Uint8Array.from(atob(value), (c) => c.charCodeAt(0));
      }
      async function hashPassword(password, saltBytes) {
        if (!crypto?.subtle)
          throw new Error(
            "Secure password hashing requires opening the app on localhost or HTTPS.",
          );
        const salt = saltBytes || crypto.getRandomValues(new Uint8Array(16));
        const material = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(password),
          "PBKDF2",
          false,
          ["deriveBits"],
        );
        const bits = await crypto.subtle.deriveBits(
          {
            name: "PBKDF2",
            salt,
            iterations: PASSWORD_ITERATIONS,
            hash: "SHA-256",
          },
          material,
          256,
        );
        return `pbkdf2$${PASSWORD_ITERATIONS}$${bytesToBase64(salt)}$${bytesToBase64(bits)}`;
      }

        const [, iterations, salt, expected] = stored.split("$");
        const actual = await hashPassword(password, base64ToBytes(salt));
        return { ok: actual.split("$")[3] === expected, needsUpgrade: false };

      function openDatabase() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB)
            return reject(
              new Error("IndexedDB is unavailable in this browser."),
            );
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = () => {
            const db = request.result;
            for (const table of DB_TABLES) {
              if (!db.objectStoreNames.contains(table))
                db.createObjectStore(table, {
                  keyPath:
                    table === "settings"
                      ? "key"
                      : table === "users"
                        ? "u"
                        : table === "sales"
                          ? "no"
                          : "id",
                });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () =>
            reject(request.error || new Error("Could not open database."));
          request.onblocked = () =>
            reject(
              new Error("Database upgrade is blocked by another open app tab."),
            );
        });
      }
      function writeDatabase() {
        if (!imsDB) return;
        try {
          const tx = imsDB.transaction(DB_TABLES, "readwrite");
          for (const table of DB_TABLES) tx.objectStore(table).clear();
          for (const item of products) tx.objectStore("products").put(item);
          for (const item of sales) tx.objectStore("sales").put(item);
          for (const item of parties) tx.objectStore("parties").put(item);
          for (const item of ledger) tx.objectStore("ledger").put(item);
          tx.objectStore("settings").put({ key: "config", ...settings });
          for (const item of loadUsers()) tx.objectStore("users").put(item);
          tx.onerror = () =>
            console.error("Darko IMS database write failed", tx.error);
        } catch (error) {
          console.error("Darko IMS database write failed", error);
        }
      }
      function readDatabase() {
        return new Promise((resolve, reject) => {
          const tx = imsDB.transaction(DB_TABLES, "readonly"),
            result = {};
          for (const table of DB_TABLES) {
            const request = tx.objectStore(table).getAll();
            request.onsuccess = () => {
              result[table] = request.result;
            };
            request.onerror = () => reject(request.error);
          }
          tx.oncomplete = () => resolve(result);
          tx.onerror = () => reject(tx.error);
        });
      }
      async function initializeDatabase() {
        try {
          imsDB = await openDatabase();
          imsDB.onversionchange = () => {
            imsDB.close();
            imsDB = null;
            databaseReady = false;
          };
          const data = await readDatabase();
          const populated = DB_TABLES.some((table) => data[table]?.length);
          if (populated) {
            // Preserve records from browser storage when an older database
            // contains only a subset of the stores.
            const stored = (key) => {
              try {
                return JSON.parse(localStorage.getItem(key) || "null");
              } catch {
                return null;
              }
            };
            const localProducts = stored(K_PROD);
            const localSales = stored(K_SALES);
            const localParties = stored(K_PARTY);
            const localLedger = stored(K_LEDGER);
            const localSettings = stored(K_SET);
            const localUsers = stored(K_USERS);
            if (!data.products?.length && localProducts?.length)
              data.products = localProducts;
            if (!data.sales?.length && localSales?.length)
              data.sales = localSales;
            if (!data.parties?.length && localParties?.length)
              data.parties = localParties;
            if (!data.ledger?.length && localLedger?.length)
              data.ledger = localLedger;
            if (!data.settings?.length && localSettings)
              data.settings = [{ key: "config", ...localSettings }];
            if (!data.users?.length && localUsers?.length)
              data.users = localUsers;
            localStorage.setItem(K_PROD, JSON.stringify(data.products));
            localStorage.setItem(K_SALES, JSON.stringify(data.sales));
            localStorage.setItem(K_PARTY, JSON.stringify(data.parties));
            localStorage.setItem(K_LEDGER, JSON.stringify(data.ledger));
            localStorage.setItem(
              K_SET,
              JSON.stringify(
                data.settings.find((x) => x.key === "config") || {},
              ),
            );
            localStorage.setItem(K_USERS, JSON.stringify(data.users));
            load();
          }
          databaseReady = true;
          writeDatabase();
          applyBranding();
          renderAll();
          const badge = document.getElementById("databaseStatus");
          if (badge)
            badge.textContent =
              "IndexedDB connected · local persistent database";
        } catch (error) {
          console.error("Darko IMS database unavailable", error);
          const badge = document.getElementById("databaseStatus");
          if (badge)
            badge.textContent =
              "Database unavailable · browser storage fallback active";
        }
      }

      /* ---------- Ledgers (Customers & Suppliers) ----------
   Convention: a POSITIVE balance means the account owes Darko  - 
   receivable for customers, payable for suppliers. */
      function partyBalance(p) {
        const sum = fromCents(
          ledger
            .filter((e) => e.partyId === p.id)
            .reduce((s, e) => s + toCents(e.dr || 0) - toCents(e.cr || 0), 0),
        );
        return p.type === "supplier"
          ? fromCents(toCents(p.openingBalance) - toCents(sum))
          : fromCents(toCents(p.openingBalance) + toCents(sum));
      }
      function partyEntries(p) {
        return ledger
          .filter((e) => e.partyId === p.id)
          .slice()
          .sort((a, b) =>
            a.date === b.date ? a.id - b.id : a.date < b.date ? -1 : 1,
          );
      }
      function runningRows(p) {
        let bal = toCents(p.openingBalance);
        return partyEntries(p).map((e) => {
          bal +=
            p.type === "supplier"
              ? toCents(e.cr || 0) - toCents(e.dr || 0)
              : toCents(e.dr || 0) - toCents(e.cr || 0);
          return Object.assign({}, e, { bal: fromCents(bal) });
        });
      }
      function nextPartyId() {
        return parties.length ? Math.max(...parties.map((x) => x.id)) + 1 : 1;
      }
      function nextEntryId() {
        return ledger.length ? Math.max(...ledger.map((x) => x.id)) + 1 : 1;
      }
      function postEntry(e) {
        e.id = nextEntryId();
        ledger.push(e);
      }
      function ensureCustomer(name) {
        let p = parties.find(
          (x) =>
            x.type === "customer" &&
            x.name.toLowerCase() === name.toLowerCase(),
        );
        if (!p) {
          p = {
            id: nextPartyId(),
            type: "customer",
            name: name.trim(),
            phone: "",
            openingBalance: 0,
          };
          parties.push(p);
        }
        return p;
      }
      function ensureSupplier(name) {
        let p = parties.find(
          (x) =>
            x.type === "supplier" &&
            x.name.toLowerCase() === name.toLowerCase(),
        );
        if (!p) {
          p = {
            id: nextPartyId(),
            type: "supplier",
            name: name.trim(),

      /* ---------- Aging (FIFO: payments offset oldest charges first) ---------- */
      function agingBuckets(p, today) {
        today = today || new Date().toISOString().slice(0, 10);
        const b = { "0-30": 0, "31-60": 0, "61-90": 0, "90+": 0 };
        const dir =
          p.type === "supplier"
            ? (e) => (e.cr || 0) - (e.dr || 0)
            : (e) => (e.dr || 0) - (e.cr || 0);
        const days = (d) =>
          Math.floor((new Date(today) - new Date(d + "T00:00:00")) / 86400000);
        const charges = [{ date: null, amt: p.openingBalance }].concat(
          partyEntries(p)
            .filter((e) => dir(e) > 0)
            .map((e) => ({ date: e.date, amt: dir(e) })),
        );
        let credits = partyEntries(p).reduce(
          (s, e) => s + Math.max(0, -dir(e)),
          0,
        );
        for (const c of charges) {
          let rem = c.amt;
          const take = Math.min(rem, credits);
          rem -= take;
          credits -= take;
          if (rem <= 0.005) continue;
          const age = c.date === null ? 999 : days(c.date);
          if (age <= 30) b["0-30"] += rem;
          else if (age <= 60) b["31-60"] += rem;
          else if (age <= 90) b["61-90"] += rem;
          else b["90+"] += rem;
        }
        return b;
      }
      function renderAging() {
        const today = new Date().toISOString().slice(0, 10);
        const custs = parties.filter((p) => p.type === "customer");
        const tot = { "0-30": 0, "31-60": 0, "61-90": 0, "90+": 0 };
        const data = custs.map((p) => {
          const b = agingBuckets(p, today);

          return { p, b, bal: partyBalance(p) };
        });

  <div class="panel" style="overflow:auto"><table><thead><tr><th>Customer</th><th class="num">Total Owed</th><th class="num">0-30 days</th><th class="num">31-60 days</th><th class="num">61-90 days</th><th class="num">90+ days</th><th></th></tr></thead><tbody>

  </tbody><tfoot><tr style="border-top:2px solid var(--border)"><td><b>TOTAL</b></td><td class="num"><b>${money(tot["0-30"] + tot["31-60"] + tot["61-90"] + tot["90+"])}</b></td><td class="num"><b>${money(tot["0-30"])}</b></td><td class="num"><b>${money(tot["31-60"])}</b></td><td class="num"><b>${money(tot["61-90"])}</b></td><td class="num"><b>${money(tot["90+"])}</b></td><td></td></tr></tfoot></table></div>

      function restoreJSON(input) {
        if (!requireAdmin()) {
          input.value = "";
          return;
        }
        const file = input.files && input.files[0];
        if (!file) return;
        if (file.size > 25000000) {
          toast("Backup file must be under 25 MB", true);
          input.value = "";
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(String(reader.result));
            const arrays = ["products", "sales", "parties", "ledger", "users"];
            if (
              !data ||
              !arrays.every((key) => Array.isArray(data[key])) ||
              !data.settings ||
              typeof data.settings !== "object"
            )
              throw new Error("This file is not a complete Darko IMS backup.");
            if (
              data.products.some(
                (p) =>
                  !p ||
                  !Number.isFinite(Number(p.id)) ||
                  !String(p.name || "").trim() ||
                  !Number.isFinite(Number(p.qty)) ||
                  !Number.isFinite(Number(p.price)),
              )
            )
              throw new Error(
                "Backup contains invalid product records; current data was not changed.",
              );
            if (
              data.sales.some(
                (s) =>
                  !s ||
                  !Number.isFinite(Number(s.no)) ||
                  !Array.isArray(s.items),
              )
            )
              throw new Error(
                "Backup contains invalid sales records; current data was not changed.",
              );
            if (!data.users.some((u) => u && u.role === "admin" && u.p))
              throw new Error(
                "Backup must contain at least one administrator account.",
              );
            if (
              !data.users.some(
                (u) => u && u.u === currentUser && u.role === "admin",
              )
            )
              throw new Error(
                "Backup must include the administrator account currently signed in, to prevent locking this installation.",
              );
            if (
              !confirm(
                `Replace this browser database with the backup from ${data.exported || "an unknown date"}? Export a backup of the current data first if you may need it.`,
              )
            )
              return;
            products = data.products;
            sales = data.sales;
            parties = data.parties;
            ledger = data.ledger;
            settings = { ...settings, ...data.settings };
            saveUsers(data.users);
            cart = [];
            persist();
            applyBranding();
            renderAll();
            toast("Full database backup restored");
          } catch (error) {
            toast(error.message || "Could not restore backup", true);
          } finally {
            input.value = "";
          }
        };
        reader.onerror = () => {
          toast("Could not read backup file", true);
          input.value = "";
        };
        reader.readAsText(file);
      }

      function parseCSV(text) {
        const rows = [];
        let row = [],
          cell = "",
          quoted = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (quoted) {
            if (c === '"' && text[i + 1] === '"') {
              cell += '"';
              i++;
            } else if (c === '"') quoted = false;
            else cell += c;
          } else if (c === '"') quoted = true;
          else if (c === ",") {
            row.push(cell);
            cell = "";
          } else if (c === "\n") {
            row.push(cell.replace(/\r$/, ""));
            rows.push(row);
            row = [];
            cell = "";
          } else cell += c;
        }
        if (cell.length || row.length) {
          row.push(cell.replace(/\r$/, ""));
          rows.push(row);
        }
        return rows;
      }
      function importInventoryCSV(input) {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const rows = parseCSV(String(reader.result).replace(/^\uFEFF/, ""));
            if (rows.length < 2) throw Error("CSV has no product rows");
            const norm = (s) =>
              String(s || "")
                .trim()
                .toLowerCase()
                .replace(/[^a-z0-9]/g, "");
            const header = rows[0].map(norm);
            const col = (names) => header.findIndex((h) => names.includes(h));
            const ix = {
              sku: col(["sku", "productcode"]),
              name: col(["product", "name", "productname"]),
              cat: col(["category", "cat"]),
              unit: col(["unit", "uom"]),
              qty: col(["quantity", "qty", "stock"]),
              price: col(["unitpriceusd", "price", "unitprice", "cost"]),
              expiry: col(["expirydate", "expiry"]),
            };
            if (ix.name < 0 || ix.qty < 0 || ix.price < 0)
              throw Error(
                "Required columns: Product/Name, Quantity, Unit Price (USD). SKU, Category, Unit and Expiry Date are optional.",
              );
            let valid = [],
              errors = [];
            rows.slice(1).forEach((r, n) => {
              if (!r.some((x) => String(x).trim())) return;
              const name = String(r[ix.name] || "").trim(),
                qty = Number(r[ix.qty]),
                price = Number(r[ix.price]);
              if (
                !name ||
                !Number.isFinite(qty) ||
                qty < 0 ||
                !Number.isFinite(price) ||
                price < 0
              ) {
                errors.push(n + 2);
                return;
              }
              valid.push({
                sku: ix.sku >= 0 ? String(r[ix.sku] || "").trim() : "",
                name,
                cat: ix.cat >= 0 ? String(r[ix.cat] || "").trim() : "Other",
                unit: ix.unit >= 0 ? String(r[ix.unit] || "").trim() : "Pcs",
                qty,
                price,
                expiry: ix.expiry >= 0 ? String(r[ix.expiry] || "").trim() : "",
              });
            });
            if (!valid.length) throw Error("No valid products found");
            if (
              !confirm(
                `Import ${valid.length} valid products${errors.length ? `; skip ${errors.length} invalid rows` : ""}? Matching SKUs will update existing product records.`,
              )
            )
              return;
            let added = 0,
              updated = 0;
            valid.forEach((v) => {
              let p = v.sku
                ? products.find(
                    (x) => x.sku.toLowerCase() === v.sku.toLowerCase(),
                  )
                : null;
              if (p) {
                Object.assign(p, v);
                updated++;
              } else {
                const id =
                  Math.max(0, ...products.map((x) => Number(x.id) || 0)) + 1;
                products.push({
                  id,
                  sku: v.sku || "DK-" + String(id).padStart(3, "0"),
                  ...v,
                });
                added++;
              }
            });
            persist();
            renderAll();
            toast(
              `Imported ${added} new, updated ${updated}${errors.length ? `; skipped ${errors.length}` : ""}`,
            );
          } catch (e) {
            toast(e.message || "Could not import CSV", true);
          } finally {
            input.value = "";
          }
        };
        reader.readAsText(file);
      }
